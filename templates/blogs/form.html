{% extends 'base.html' %}
{% block title %}{{ title }} – Scalora{% endblock %}
{% block content %}
<div class="page-header-section"><div class="container"><h1 class="page-title">{{ title }}</h1></div></div>
<section class="py-section"><div class="container"><div class="row justify-content-center"><div class="col-lg-8">
<div class="glass-card p-5">
<form method="POST" enctype="multipart/form-data">{% csrf_token %}
<div class="mb-3"><label class="scalora-label">Title</label>{{ form.title }}</div>
<div class="mb-3"><label class="scalora-label">Excerpt (short summary)</label>{{ form.excerpt }}</div>
<div class="mb-3"><label class="scalora-label">Content</label>{{ form.content }}</div>
<div class="mb-3"><label class="scalora-label">Featured Image</label>{{ form.image }}</div>
<div class="mb-3"><label class="scalora-label">Tags (comma separated)</label>{{ form.tags }}</div>
<div class="mb-4"><div class="form-check">{{ form.is_published }}<label class="form-check-label scalora-label ms-2">Publish immediately</label></div></div>
<div class="d-flex gap-3">
<button type="submit" class="btn scalora-btn-primary">{{ title }}</button>
<a href="/dashboard/admin/blogs/" class="btn scalora-btn-ghost">Cancel</a>
</div></form></div>
</div></div></div></section>
{% endblock %}
